<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 — 招聘数据分析系统</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }
        .container { width: 100%; max-width: 400px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon {
            width: 56px; height: 56px;
            background: #f5f5f7;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .brand-icon svg { width: 26px; height: 26px; stroke: #1d1d1f; fill: none; stroke-width: 1.5; stroke-linecap: round; }
        .brand h1 { font-family: -apple-system, "SF Pro Display", sans-serif; font-size: 22px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.5px; }
        .brand p { font-size: 14px; color: rgba(0,0,0,0.48); margin-top: 5px; letter-spacing: -0.224px; }
        .card { background: #fff; border-radius: 18px; padding: 28px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06); animation: cardIn 0.45s cubic-bezier(0.25,0.46,0.45,0.94) both; }
        @keyframes cardIn { from{opacity:0;transform:translateY(20px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
        .tip { background: #f5f5f7; border-radius: 10px; padding: 12px 14px; font-size: 13px; color: rgba(0,0,0,0.6); margin-bottom: 18px; letter-spacing: -0.12px; line-height: 1.5; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #1d1d1f; margin-bottom: 5px; letter-spacing: -0.12px; }
        .form-group input { width: 100%; height: 42px; border: 1px solid rgba(0,0,0,0.15); border-radius: 10px; padding: 0 13px; font-size: 15px; font-family: inherit; color: #1d1d1f; background: #fff; transition: border-color 0.15s, box-shadow 0.15s; letter-spacing: -0.224px; outline: none; }
        .form-group input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.15); }
        .form-group input::placeholder { color: rgba(0,0,0,0.3); }
        .btn-reset { width: 100%; height: 44px; background: #0071e3; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 500; letter-spacing: -0.224px; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
        .btn-reset:hover { background: #0077ed; }
        .divider { height: 1px; background: rgba(0,0,0,0.06); margin: 18px 0; }
        .links { text-align: center; font-size: 13px; color: rgba(0,0,0,0.48); }
        .links a { color: #0066cc; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .error-msg { background: rgba(255,59,48,0.08); color: #c0392b; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
        .success-msg { background: rgba(52,199,89,0.1); color: #1a7a3a; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <h1>重置密码</h1>
        <p>通过账号和手机号验证身份</p>
    </div>
    <div class="card">
        <div class="tip">请输入注册时绑定的手机号进行身份验证，验证通过后即可设置新密码。</div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="resetForm">
            {% csrf_token %}
            <div class="form-group"><label>账号</label><input type="text" name="user_id" placeholder="请输入账号" required></div>
            <div class="form-group"><label>手机号</label><input type="text" name="phone" placeholder="注册时绑定的手机号" required></div>
            <div class="form-group"><label>新密码</label><input type="password" name="new_password" placeholder="至少6位" required></div>
            <div class="form-group"><label>确认新密码</label><input type="password" name="confirm_password" placeholder="再次输入新密码" required></div>
            <button type="submit" class="btn-reset" id="resetBtn">重置密码</button>
        </form>
        <div class="divider"></div>
        <div class="links"><a href="{% url 'login' %}">返回登录</a></div>
    </div>
</div>
<script src="/static/vendor/jquery/jquery.min.js"></script>
<script>
$(function(){
    $('#resetForm').submit(function(e){
        e.preventDefault();
        var $btn = $('#resetBtn').text('验证中...').prop('disabled', true);
        $.ajax({
            url: '{% url "reset_password" %}',
            type: 'POST', data: $(this).serialize(),
            success: function(res){
                if(res.code === 0){
                    $('#errorMsg').hide();
                    $('#successMsg').text(res.msg).show();
                    setTimeout(function(){ window.location.href = '{% url "login" %}'; }, 1500);
                } else {
                    $('#successMsg').hide();
                    $('#errorMsg').text(res.msg).show();
                    $btn.text('重置密码').prop('disabled', false);
                }
            },
            error: function(){ $('#errorMsg').text('网络错误').show(); $btn.text('重置密码').prop('disabled', false); }
        });
    });
    $('input').on('input', function(){ $('#errorMsg').hide(); });
});
</script>
</body>
</html>
