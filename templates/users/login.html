<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 — 招聘数据分析系统</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeUp 0.4s 0.05s cubic-bezier(0.25,0.46,0.45,0.94) both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }
        }
        .brand-icon {
            width: 56px; height: 56px;
            background: #0071e3;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,113,227,0.3);
        }
        .brand-icon svg { width: 28px; height: 28px; fill: #fff; }
        .brand h1 {
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        .brand p {
            font-size: 14px;
            color: rgba(0,0,0,0.48);
            margin-top: 6px;
            letter-spacing: -0.224px;
        }
        .card {
            background: #fff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
            animation: cardIn 0.45s cubic-bezier(0.25,0.46,0.45,0.94) both;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(20px) scale(0.98); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 6px;
            letter-spacing: -0.12px;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            font-family: inherit;
            color: #1d1d1f;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
            letter-spacing: -0.224px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
        }
        .form-group input::placeholder { color: rgba(0,0,0,0.3); }
        .btn-login {
            width: 100%;
            height: 44px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: -0.224px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .btn-login:hover {
            background: #0077ed;
            box-shadow: 0 2px 12px rgba(0,113,227,0.35);
        }
        .btn-login:active { background: #006edb; }
        .divider {
            height: 1px;
            background: rgba(0,0,0,0.06);
            margin: 20px 0;
        }
        .links {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .links a {
            color: #0066cc;
            text-decoration: none;
            letter-spacing: -0.224px;
        }
        .links a:hover { text-decoration: underline; }
        .error-msg {
            background: rgba(255,59,48,0.08);
            color: #c0392b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            letter-spacing: -0.12px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
        </div>
        <h1>招聘数据分析系统</h1>
        <p>Recruitment Data Analysis Platform</p>
    </div>

    <div class="card">
        <div class="error-msg" id="errorMsg"></div>
        <form id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="user">账号</label>
                <input type="text" id="user" name="user" placeholder="请输入账号" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">登录</button>
        </form>
        <div class="divider"></div>
        <div class="links">
            <a href="{% url 'register' %}">创建账号</a>
            <a href="{% url 'reset_password' %}">忘记密码？</a>
        </div>
    </div>
</div>

<script src="/static/vendor/jquery/jquery.min.js"></script>
<script>
$(function(){
    $('#loginForm').submit(function(e){
        e.preventDefault();
        var $btn = $('#loginBtn').text('登录中...').prop('disabled', true);
        $.ajax({
            url: '{% url "login" %}',
            type: 'POST',
            data: $(this).serialize(),
            success: function(res){
                if(res.code === 0){
                    window.location.href = '{% url "welcome" %}';
                } else {
                    $('#errorMsg').text(res.msg).show();
                    $btn.text('登录').prop('disabled', false);
                }
            },
            error: function(){
                $('#errorMsg').text('网络错误，请重试').show();
                $btn.text('登录').prop('disabled', false);
            }
        });
    });
    // 输入时隐藏错误
    $('input').on('input', function(){ $('#errorMsg').hide(); });
});
</script>
</body>
</html>
