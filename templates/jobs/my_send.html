{% extends 'base.html' %}

{% block title %}我的投递 - 招聘数据分析系统{% endblock %}

{% block content %}
<!-- 漏斗 + 趋势 -->
<div class="row mb-4">
    <div class="col-lg-5">
        <div class="card shadow h-100">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">投递漏斗</h6>
            </div>
            <div class="card-body">
                <div id="funnelChart" style="height:220px;"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card shadow h-100">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">近30天投递趋势</h6>
            </div>
            <div class="card-body">
                <div id="trendChart" style="height:220px;"></div>
            </div>
        </div>
    </div>
</div>
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">我的投递记录</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="sendTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>职位名称</th>
                        <th>薪资</th>
                        <th>地点</th>
                        <th>公司</th>
                        <th>学历</th>
                        <th>投递时间</th>
                        <th>状态</th>
                        <th>更新状态</th>
                    </tr>
                </thead>
                <tbody id="sendTableBody">
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
            </ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(function(){
    var currentPage = 1;
    var pageSize = 10;
    
    function loadData(page) {
        currentPage = page || 1;
        $.ajax({
            url: '{% url "get_my_send_list" %}',
            type: 'GET',
            data: { page: currentPage, limit: pageSize },
            success: function(res) {
                if(res.code === 0) {
                    renderTable(res.data);
                    renderPagination(res.count);
                }
            }
        });
    }
    
    function getStatusBadge(status) {
        var badges = {
            '已投递': 'badge-primary',
            '已查看': 'badge-warning',
            '邀请面试': 'badge-success',
            '不合适': 'badge-secondary',
            '已Offer': 'badge-info'
        };
        return '<span class="badge ' + (badges[status] || 'badge-secondary') + '">' + status + '</span>';
    }
    
    function renderTable(data) {
        var html = '';
        if(data && data.length > 0) {
            data.forEach(function(item) {
                html += '<tr>';
                html += '<td>' + item.send_id + '</td>';
                html += '<td>' + (item.name || '-') + '</td>';
                html += '<td>' + (item.salary || '-') + '</td>';
                html += '<td>' + (item.place || '-') + '</td>';
                html += '<td>' + (item.company || '-') + '</td>';
                html += '<td>' + (item.education || '-') + '</td>';
                html += '<td>' + (item.created_at || '-') + '</td>';
                html += '<td>' + getStatusBadge(item.status) + '</td>';
                html += '<td>';
                html += '<select class="form-control form-control-sm status-select" data-id="' + item.send_id + '">';
                html += '<option value="0"' + (item.status_value === 0 ? ' selected' : '') + '>已投递</option>';
                html += '<option value="1"' + (item.status_value === 1 ? ' selected' : '') + '>已查看</option>';
                html += '<option value="2"' + (item.status_value === 2 ? ' selected' : '') + '>邀请面试</option>';
                html += '<option value="3"' + (item.status_value === 3 ? ' selected' : '') + '>不合适</option>';
                html += '<option value="4"' + (item.status_value === 4 ? ' selected' : '') + '>已Offer</option>';
                html += '</select>';
                html += '</td>';
                html += '</tr>';
            });
        } else {
            html = '<tr><td colspan="9" class="text-center">暂无投递记录</td></tr>';
        }
        $('#sendTableBody').html(html);
    }
    
    function renderPagination(total) {
        var totalPages = Math.ceil(total / pageSize);
        var html = '';
        html += '<li class="page-item ' + (currentPage <= 1 ? 'disabled' : '') + '">';
        html += '<a class="page-link" href="javascript:;" data-page="' + (currentPage - 1) + '">上一页</a></li>';
        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, currentPage + 2);
        for(var i = startPage; i <= endPage; i++) {
            html += '<li class="page-item ' + (i === currentPage ? 'active' : '') + '">';
            html += '<a class="page-link" href="javascript:;" data-page="' + i + '">' + i + '</a></li>';
        }
        html += '<li class="page-item ' + (currentPage >= totalPages ? 'disabled' : '') + '">';
        html += '<a class="page-link" href="javascript:;" data-page="' + (currentPage + 1) + '">下一页</a></li>';
        html += '<li class="page-item disabled"><span class="page-link">共 ' + total + ' 条</span></li>';
        $('#pagination').html(html);
    }
    
    $('#pagination').on('click', 'a.page-link', function() {
        var page = $(this).data('page');
        if(page && !$(this).parent().hasClass('disabled')) {
            loadData(page);
        }
    });

    // 更新状态
    $('#sendTableBody').on('change', '.status-select', function() {
        var sendId = $(this).data('id');
        var status = $(this).val();

        $.ajax({
            url: '{% url "update_send_status" %}',
            type: 'POST',
            data: {
                send_id: sendId,
                status: status,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(res) {
                if(res.code !== 0) {
                    alert(res.msg || '状态更新失败');
                } else {
                    loadData(currentPage);
                }
            }
        });
    });
    
    loadData(1);

    // ── 漏斗图 ──────────────────────────────────────────
    var funnelChart = echarts.init(document.getElementById('funnelChart'));
    $.get('{% url "send_funnel" %}', function(res) {
        if (res.code !== 0) return;
        var d = res.data;
        var order = ['已投递','已查看','邀请面试','已Offer','不合适'];
        var funnelData = order.filter(k => d[k] > 0).map(k => ({name: k, value: d[k]}));
        funnelChart.setOption({
            tooltip: {trigger:'item', formatter:'{b}: {c}'},
            series: [{
                type: 'funnel', left:'10%', width:'80%', top:10, bottom:10,
                sort:'descending', gap:4,
                label: {show:true, position:'inside', formatter:'{b} {c}'},
                data: funnelData,
                itemStyle: {borderWidth:0}
            }]
        });
    });

    // ── 趋势图 ──────────────────────────────────────────
    var trendChart = echarts.init(document.getElementById('trendChart'));
    $.get('{% url "get_trend_data" %}', {days:30}, function(res) {
        if (res.code !== 0) return;
        trendChart.setOption({
            tooltip: {trigger:'axis'},
            grid: {left:'8%', right:'5%', top:'15%', bottom:'15%'},
            xAxis: {type:'category', data:res.labels, axisLabel:{fontSize:10}},
            yAxis: {type:'value', minInterval:1, axisLabel:{fontSize:10}},
            series: [{
                type:'line', data:res.values, smooth:true,
                areaStyle:{color:'rgba(0,113,227,0.08)'},
                lineStyle:{color:'#0071e3', width:2},
                itemStyle:{color:'#0071e3'}
            }]
        });
    });

    $(window).resize(function(){ funnelChart.resize(); trendChart.resize(); });
});
</script>
{% endblock %}
