{% extends 'base.html' %}
{% block title %}职位列表 - 招聘数据分析系统{% endblock %}
{% block extra_css %}
<style>
.co-btn{cursor:pointer;color:#2d3748;background:none;border:none;border-bottom:1px dashed #4e73df;padding:0;font-size:inherit;text-align:left;}
.co-btn:hover{color:#4e73df;text-decoration:none;}
.v-ok{color:#1cc88a;font-size:10px;margin-left:3px;}
.v-bad{color:#e74a3b;font-size:10px;margin-left:3px;}
.v-risk{color:#f6c23e;font-size:10px;margin-left:3px;}
</style>
{% endblock %}
{% block content %}

<!-- 精细筛选面板 -->
<div class="card shadow mb-3" id="filterCard">
<div class="card-body py-3">
<!-- 第一行：关键词 + 搜索按钮 -->
<div class="row align-items-center mb-3">
<div class="col-md-8">
<div class="input-group">
<div class="input-group-prepend"><span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span></div>
<input type="text" id="kwInput" class="form-control border-left-0" placeholder="搜索职位名称、公司名称、技能关键词..." style="font-size:15px">
</div>
</div>
<div class="col-md-4 d-flex">
<button class="btn btn-primary flex-fill mr-2" id="searchBtn"><i class="fas fa-search mr-1"></i>搜索</button>
<button class="btn btn-outline-secondary" id="resetBtn" title="清除所有筛选"><i class="fas fa-undo"></i></button>
</div>
</div>
<!-- 第二行：热门城市快选 -->
<div class="mb-3">
<span class="text-muted small mr-2">城市：</span>
<div class="d-inline-flex flex-wrap" style="gap:6px" id="cityTags">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="city" data-val="">全部</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="北京">北京</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="上海">上海</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="深圳">深圳</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="广州">广州</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="杭州">杭州</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="成都">成都</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="武汉">武汉</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="南京">南京</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="city" data-val="西安">西安</button>
<input type="text" id="cityCustom" class="form-control form-control-sm d-inline-block" placeholder="其他城市" style="width:90px">
</div>
</div>
<!-- 第三行：经验 -->
<div class="mb-3">
<span class="text-muted small mr-2">经验：</span>
<div class="d-inline-flex flex-wrap" style="gap:6px">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="experience" data-val="">不限</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="experience" data-val="无需经验">无需经验</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="experience" data-val="1年">1年以内</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="experience" data-val="1-3年">1-3年</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="experience" data-val="3-5年">3-5年</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="experience" data-val="5年及以上">5年以上</button>
</div>
</div>
<!-- 第四行：学历 -->
<div class="mb-3">
<span class="text-muted small mr-2">学历：</span>
<div class="d-inline-flex flex-wrap" style="gap:6px">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="edu" data-val="">不限</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="edu" data-val="大专">大专</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="edu" data-val="本科">本科</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="edu" data-val="硕士">硕士</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="edu" data-val="博士">博士</button>
</div>
</div>
<!-- 高级筛选折叠 -->
<div>
<a href="#" class="text-muted small" data-toggle="collapse" data-target="#advFilter">
<i class="fas fa-sliders-h mr-1"></i>高级筛选 <i class="fas fa-chevron-down fa-xs"></i>
</a>
</div>
<div class="collapse mt-3" id="advFilter">
<div class="row">
<!-- 薪资范围 -->
<div class="col-md-6 mb-3">
<label class="text-muted small mb-1">薪资范围（K/月）</label>
<div class="d-flex align-items-center" style="gap:8px">
<input type="number" id="salMin" class="form-control form-control-sm" placeholder="最低" min="0" max="200" style="width:80px">
<span class="text-muted"></span>
<input type="number" id="salMax" class="form-control form-control-sm" placeholder="最高" min="0" max="200" style="width:80px">
<span class="text-muted small">K</span>
</div>
<div class="d-flex flex-wrap mt-1" style="gap:4px">
<button class="btn btn-xs btn-outline-secondary sal-preset" data-min="0" data-max="10">10K以下</button>
<button class="btn btn-xs btn-outline-secondary sal-preset" data-min="10" data-max="20">10-20K</button>
<button class="btn btn-xs btn-outline-secondary sal-preset" data-min="20" data-max="30">20-30K</button>
<button class="btn btn-xs btn-outline-secondary sal-preset" data-min="30" data-max="50">30-50K</button>
<button class="btn btn-xs btn-outline-secondary sal-preset" data-min="50" data-max="">50K以上</button>
</div>
</div>
<!-- 公司类型 -->
<div class="col-md-6 mb-3">
<label class="text-muted small mb-1">公司类型</label>
<div class="d-flex flex-wrap" style="gap:6px">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="company_type" data-val="">不限</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="民营">民营</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="已上市">上市公司</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="国企">国企</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="外资">外资</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="合资">合资</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="company_type" data-val="创业公司">创业公司</button>
</div>
</div>
<!-- 公司规模 -->
<div class="col-md-6 mb-3">
<label class="text-muted small mb-1">公司规模</label>
<div class="d-flex flex-wrap" style="gap:6px">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="scale" data-val="">不限</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="少于50人">50人以下</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="50-150人">50-150人</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="150-500人">150-500人</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="500-1000人">500-1000人</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="1000-5000人">1000-5000人</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="scale" data-val="10000人以上">万人以上</button>
</div>
</div>
<!-- 数据来源 -->
<div class="col-md-6 mb-3">
<label class="text-muted small mb-1">数据来源</label>
<div class="d-flex flex-wrap" style="gap:6px">
<button class="btn btn-sm btn-outline-secondary filter-tag active" data-field="source" data-val="">全部</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="source" data-val="51job">51job</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="source" data-val="BOSS直聘">BOSS直聘</button>
<button class="btn btn-sm btn-outline-secondary filter-tag" data-field="source" data-val="CSV导入">CSV导入</button>
</div>
</div>
<!-- 只看收藏 -->
<div class="col-md-12 mb-1">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="onlyFav">
<label class="form-check-label text-muted small" for="onlyFav">只看已收藏职位</label>
</div>
</div>
</div>
</div>
<!-- 当前筛选标签展示 -->
<div id="activeFilters" class="mt-2 d-none">
<span class="text-muted small mr-1">已筛选：</span>
<span id="filterBadges"></span>
</div>
</div>
</div>
<div class="card shadow mb-4">
<div class="card-header py-3 d-flex justify-content-between align-items-center">
<h6 class="m-0 font-weight-bold text-primary">职位列表</h6>
<div><button class="btn btn-sm btn-outline-info mr-2" id="compareBtn" disabled><i class="fas fa-columns mr-1"></i>对比已选 (<span id="compareCount">0</span>)</button></div>
</div>
<div class="card-body"><div class="table-responsive">
<table class="table table-hover" id="jobTable" width="100%">
<thead><tr>
<th style="width:36px"><input type="checkbox" id="checkAll"></th>
<th>ID</th><th>职位名称</th><th>薪资</th><th>地点</th><th>学历</th><th>经验</th>
<th>公司 <small class="text-muted" style="font-weight:normal;font-size:10px">点击验证</small></th>
<th>来源</th><th>关键词</th><th>操作</th>
</tr></thead>
<tbody id="jobTableBody"></tbody>
</table></div>
<nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
</div></div>

<!-- 投递确认弹窗（无链接时使用） -->
<div class="modal fade" id="sendModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title"><i class="fas fa-paper-plane mr-2 text-primary"></i>投递职位</h5>
<button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
<div class="modal-body" id="sendModalBody"></div>
<div class="modal-footer">
<a id="sendOrigLink" href="#" target="_blank" class="btn btn-outline-secondary btn-sm d-none"><i class="fas fa-external-link-alt mr-1"></i>前往原始职位页</a>
<button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">取消</button>
<button type="button" class="btn btn-primary btn-sm" id="confirmSendBtn"><i class="fas fa-bookmark mr-1"></i>记录投递进度</button>
</div></div></div></div>

<!-- 企业验证弹窗 -->
<div class="modal fade" id="companyModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title"><i class="fas fa-shield-alt mr-2 text-info"></i>企业信息验证  <span id="modalCoName"></span></h5>
<button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
<div class="modal-body" id="companyModalBody"></div>
<div class="modal-footer">
<a id="coDetailLink" href="#" target="_blank" class="btn btn-outline-info btn-sm d-none"><i class="fas fa-external-link-alt mr-1"></i>爱企查详情</a>
<button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">关闭</button>
</div></div></div></div>

<!-- 职位对比弹窗 -->
<div class="modal fade" id="compareModal" tabindex="-1">
<div class="modal-dialog modal-xl"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title"><i class="fas fa-columns mr-2"></i>职位对比</h5>
<button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
</div><div class="modal-body" id="compareBody"></div>
</div></div></div>
{% endblock %}
{% block extra_js %}
<div id="_urls" style="display:none"
  data-list="{% url 'get_job_list' %}"
  data-compare="{% url 'compare_jobs' %}"
  data-fav="{% url 'favorite_job' %}"
  data-send="{% url 'send_job' %}"
  data-csrf="{{ csrf_token }}"
></div>
<script src="/static/js/job_list.js"></script>
{% endblock %}
