{% extends 'base.html' %}
{% block title %}AI 求职助手 - 招聘数据分析系统{% endblock %}

{% block extra_css %}
<style>
.chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:400px; }
.chat-messages { flex:1; overflow-y:auto; padding:16px; background:#f5f5f7; border-radius:12px; margin-bottom:12px; }
.msg { display:flex; margin-bottom:14px; align-items:flex-start; }
.msg.user { flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.msg.bot .msg-avatar { background:#1d1d1f; color:#fff; margin-right:10px; }
.msg.user .msg-avatar { background:#0071e3; color:#fff; margin-left:10px; }
.msg-bubble { max-width:78%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.65; word-break:break-word; font-family:-apple-system,"SF Pro Text",sans-serif; letter-spacing:-0.224px; }
.msg.bot .msg-bubble { background:#fff; border:1px solid rgba(0,0,0,0.06); border-radius:0 12px 12px 12px; color:#1d1d1f; }
.msg.user .msg-bubble { background:#0071e3; color:#fff; border-radius:12px 0 12px 12px; }
.msg-time { font-size:11px; color:rgba(0,0,0,0.3); margin-top:4px; letter-spacing:-0.12px; }
.msg.user .msg-time { text-align:right; }
.msg-bubble table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
.msg-bubble table th, .msg-bubble table td { border:1px solid rgba(0,0,0,0.08); padding:6px 10px; }
.msg-bubble table th { background:#f5f5f7; font-weight:600; }
.msg-bubble a { color:#0066cc; }
.msg.user .msg-bubble a { color:rgba(255,255,255,0.85); }
.btn-group-chat { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.btn-group-chat .btn { font-size:12px; padding:5px 12px; border-radius:980px; }
.chat-input-wrap { display:flex; gap:8px; align-items:flex-end; }
.chat-input-wrap textarea { flex:1; border-radius:12px; padding:10px 14px; border:1px solid rgba(0,0,0,0.12); font-size:14px; resize:none; min-height:42px; max-height:120px; overflow-y:auto; line-height:1.5; font-family:-apple-system,"SF Pro Text",sans-serif; letter-spacing:-0.224px; color:#1d1d1f; background:#fff; }
.chat-input-wrap textarea:focus { outline:none; border-color:#0071e3; box-shadow:0 0 0 3px rgba(0,113,227,0.12); }
.chat-input-wrap button { border-radius:12px; padding:10px 18px; height:42px; background:#0071e3; border:none; color:#fff; }
.chat-input-wrap button:hover { background:#0077ed; }
.quick-btns { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.quick-btns .btn { font-size:12px; border-radius:980px; border:1px solid rgba(0,0,0,0.12); background:#fff; color:#1d1d1f; }
.quick-btns .btn:hover { background:#f5f5f7; border-color:rgba(0,0,0,0.2); }
.btn-outline-purple { color:#6f42c1; border-color:#6f42c1; }
.btn-outline-purple:hover { background:#6f42c1; color:#fff; }
.typing { display:flex; align-items:center; gap:4px; padding:6px 10px; }
.typing span { width:6px; height:6px; background:rgba(0,0,0,0.25); border-radius:50%; animation:bounce .8s infinite; }
.typing span:nth-child(2) { animation-delay:.15s; }
.typing span:nth-child(3) { animation-delay:.3s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
.jd-hint { background:rgba(0,113,227,0.06); border:1px solid rgba(0,113,227,0.2); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:12px; color:#0066cc; display:none; letter-spacing:-0.12px; }
.notif-badge { background:#ff3b30; color:#fff; border-radius:980px; padding:1px 7px; font-size:11px; margin-left:4px; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <div class="card shadow">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">
                    <i class="fas fa-robot mr-2"></i>AI 求职助手
                    <span id="notifBadge" class="notif-badge" style="display:none;"></span>
                </h6>
                <div class="d-flex align-items-center gap-2">
                    <a href="{% url 'agent_dashboard' %}" class="btn btn-sm btn-outline-primary mr-1">
                        <i class="fas fa-star mr-1"></i>智能推荐
                    </a>
                    <button class="btn btn-sm btn-outline-secondary mr-1" id="clearBtn" title="清空对话">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <a href="{% url 'llm_config' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-cog"></i>
                    </a>
                </div>
            </div>
            <div class="card-body pb-3">
                <!-- JD 对比提示 -->
                <div class="jd-hint" id="jdHint">
                    <i class="fas fa-lightbulb mr-1"></i>
                    检测到你粘贴了较长文本，我会自动分析这是否是职位JD并与你的简历对比。
                </div>

                <!-- 快捷指令 -->
                <div class="quick-btns">
                    <button class="btn btn-outline-primary btn-sm quick-cmd" data-cmd="帮我优化简历">📝 简历优化</button>
                    <button class="btn btn-outline-success btn-sm quick-cmd" data-cmd="推荐适合我的职位">🎯 职位推荐</button>
                    <button class="btn btn-outline-info btn-sm quick-cmd" data-cmd="Python工程师薪资行情">💰 薪资查询</button>
                    <button class="btn btn-outline-warning btn-sm quick-cmd" data-cmd="Python工程师面试准备">🎯 面试准备</button>
                    <button class="btn btn-outline-purple btn-sm quick-cmd" data-cmd="职业规划建议">🚀 职业规划</button>
                    <button class="btn btn-outline-secondary btn-sm quick-cmd" data-cmd="求职策略建议">💡 求职策略</button>
                    <button class="btn btn-outline-dark btn-sm quick-cmd" data-cmd="你能做什么">❓ 帮助</button>
                </div>

                <div class="chat-wrap">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-wrap">
                        <textarea id="chatInput" placeholder="输入问题，或粘贴职位JD让我分析匹配度..." rows="1"></textarea>
                        <button class="btn btn-primary" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
$(function(){
    var $msgs = $('#chatMessages');
    var $input = $('#chatInput');
    var sending = false;

    // ── 加载历史对话 ──────────────────────────────────────
    $.get('{% url "agent_chat_history" %}', function(res) {
        if (res.code === 0 && res.data.length) {
            res.data.forEach(function(m) {
                if (m.role === 'user') {
                    appendMsg('user', m.content, m.created_at);
                } else {
                    // assistant 消息用 markdown 渲染
                    var $bubble = $('<div class="msg-bubble">').html(marked.parse(m.content || ''));
                    var $msg = $('<div class="msg bot">').append(
                        $('<div class="msg-avatar">').html('<i class="fas fa-robot"></i>'),
                        $('<div>').append($bubble, $('<div class="msg-time">').text(m.created_at))
                    );
                    $msgs.append($msg);
                }
            });
            scrollBottom();
        } else {
            // 无历史，显示欢迎语
            showWelcome();
        }
    }).fail(showWelcome);

    // ── 加载未读通知 ──────────────────────────────────────
    $.get('{% url "agent_notifications" %}', function(res) {
        if (res.code === 0 && res.count > 0) {
            $('#notifBadge').text(res.count + ' 新').show();
            var lines = res.data.map(function(n) {
                return `- **${n.job_name}** | ${n.company} | ${n.salary || '薪资面议'} | ${n.city}`;
            }).join('\n');
            renderReply({
                type: 'markdown',
                text: `🔔 **发现 ${res.count} 个新匹配职位**\n\n${lines}\n\n[查看全部职位](/job/list/)`
            });
        }
    });

    function showWelcome() {
        renderReply({
            type: 'markdown',
            text: `👋 你好！我是你的 **AI 求职助手**。

我可以帮你：

**📝 简历与求职**
- 优化简历，提高通过率
- 分析职位JD匹配度
- 智能推荐合适职位
- 提供求职策略建议

**🎯 面试与发展**
- 面试准备和技巧
- 职业规划建议
- 技能学习路线
- 公司背景查询

**💰 薪资与市场**
- 查询岗位薪资行情
- 分析市场数据趋势
- 企业信息验证

**💡 使用技巧**
- 直接用自然语言提问
- 粘贴职位JD自动分析
- 点击快捷按钮快速开始

试试问我："**优化我的简历**" 或 "**Python工程师面试准备**"！`
        });
    }

    // ── 快捷指令 ──────────────────────────────────────────
    $('.quick-cmd').click(function(){
        $input.val($(this).data('cmd'));
        autoResize();
        sendMessage();
    });

    // ── 输入框自动高度 ────────────────────────────────────
    function autoResize() {
        $input[0].style.height = 'auto';
        $input[0].style.height = Math.min($input[0].scrollHeight, 120) + 'px';
    }
    $input.on('input', function() {
        autoResize();
        // 检测是否粘贴了长文本（可能是JD）
        if ($(this).val().length > 100) {
            $('#jdHint').slideDown(200);
        } else {
            $('#jdHint').slideUp(200);
        }
    });

    // ── 发送 ──────────────────────────────────────────────
    $('#sendBtn').click(sendMessage);
    $input.keydown(function(e){
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function sendMessage() {
        var msg = $input.val().trim();
        if (!msg || sending) return;
        sending = true;
        $input.val('').css('height', '42px');
        $('#jdHint').hide();
        $('#notifBadge').hide();

        appendMsg('user', msg);
        var $typing = appendTyping();

        $.ajax({
            url: '{% url "agent_chat_api" %}',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({message: msg}),
            headers: {'X-CSRFToken': '{{ csrf_token }}'},
            success: function(res) {
                $typing.remove();
                sending = false;
                if (res.code === 0) {
                    renderReply(res.reply);
                } else {
                    appendMsg('bot', '❌ ' + (res.msg || '出错了，请重试'));
                }
            },
            error: function() {
                $typing.remove();
                sending = false;
                appendMsg('bot', '❌ 网络错误，请重试');
            }
        });
    }

    // ── 清空对话 ──────────────────────────────────────────
    $('#clearBtn').click(function() {
        if (!confirm('确定清空所有对话记录？')) return;
        $.post('{% url "agent_chat_clear" %}', {csrfmiddlewaretoken: '{{ csrf_token }}'}, function(res) {
            if (res.code === 0) {
                $msgs.empty();
                showWelcome();
            }
        });
    });

    // ── 渲染回复 ──────────────────────────────────────────
    function renderReply(reply) {
        if (!reply) return;
        var type = reply.type || 'text';
        var text = reply.text || '';
        var now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        var $bubble;

        if (type === 'markdown') {
            $bubble = $('<div class="msg-bubble">').html(marked.parse(text));
        } else {
            $bubble = $('<div class="msg-bubble">').text(text);
        }

        if (reply.link) {
            $bubble.append($('<div class="mt-2">').append(
                $('<a class="btn btn-sm btn-outline-primary">').attr('href', reply.link.url).text(reply.link.text)
            ));
        }

        if (reply.buttons && reply.buttons.length) {
            var $btnGroup = $('<div class="btn-group-chat">');
            reply.buttons.forEach(function(btn) {
                var $b = $('<button class="btn btn-sm btn-outline-primary">').text(btn.label);
                if (btn.action === 'start_spider') {
                    $b.click(function() { doStartSpider(btn.params); $b.prop('disabled', true).text('已启动 ✓'); });
                } else if (btn.action === 'cancel') {
                    $b.removeClass('btn-outline-primary').addClass('btn-outline-secondary');
                    $b.click(function() { $b.closest('.msg').fadeOut(300, function(){ $(this).remove(); }); });
                }
                $btnGroup.append($b);
            });
            $bubble.append($btnGroup);
        }

        var $msg = $('<div class="msg bot">').append(
            $('<div class="msg-avatar">').html('<i class="fas fa-robot"></i>'),
            $('<div>').append($bubble, $('<div class="msg-time">').text(now))
        );
        $msgs.append($msg);
        scrollBottom();
    }

    function appendMsg(role, text, time) {
        var isUser = role === 'user';
        var now = time || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        var $avatar = $('<div class="msg-avatar">').html(isUser ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>');
        var $bubble = $('<div class="msg-bubble">').text(text);
        var $msg = $('<div class="msg ' + role + '">').append(
            $avatar,
            $('<div>').append($bubble, $('<div class="msg-time">').text(now))
        );
        $msgs.append($msg);
        scrollBottom();
    }

    function appendTyping() {
        var $t = $('<div class="msg bot">').append(
            $('<div class="msg-avatar">').html('<i class="fas fa-robot"></i>'),
            $('<div class="msg-bubble">').append(
                $('<div class="typing">').append('<span></span><span></span><span></span>')
            )
        );
        $msgs.append($t);
        scrollBottom();
        return $t;
    }

    function scrollBottom() { $msgs.scrollTop($msgs[0].scrollHeight); }

    function doStartSpider(params) {
        $.ajax({
            url: '{% url "start_spider" %}',
            type: 'POST',
            data: { keyword: params.keyword, pages: params.pages || 3, max_workers: 2, csrfmiddlewaretoken: '{{ csrf_token }}' },
            success: function(res) {
                renderReply({ type: 'text', text: res.code === 0 ? '✅ ' + res.msg : '❌ ' + res.msg });
            }
        });
    }
});
</script>
{% endblock %}
